<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Uniqo">
  <title>Uniqo</title>
  <defs>
    <linearGradient id="gold" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f6224"/>
      <stop offset=".35" stop-color="#e9c983"/>
      <stop offset=".55" stop-color="#b8873b"/>
      <stop offset=".8" stop-color="#f4dfae"/>
      <stop offset="1" stop-color="#8f6224"/>
    </linearGradient>
    <linearGradient id="silk" x1="18" y1="22" x2="46" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf4e6"/>
      <stop offset=".5" stop-color="#e9dcc3"/>
      <stop offset="1" stop-color="#cdb68d"/>
    </linearGradient>
    <radialGradient id="disc" cx="32" cy="26" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2119"/>
      <stop offset="1" stop-color="#0f0d0c"/>
    </radialGradient>
  </defs>
  <!-- seal -->
  <circle cx="32" cy="32" r="30.5" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#gold)" stroke-width=".6" stroke-dasharray=".6 2.4" stroke-linecap="round"/>
  <!-- the U: a gold-edged column -->
  <path d="M21 17v16.5a11 11 0 0 0 22 0V17" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- needle passes through the silk: made by hand -->
  <path d="M50 8.5 39.5 33" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- silk drape falling across the U, like a pallu -->
  <path d="M17.5 23.5c7 3.6 15.6 4.3 28.4-2.8l1.4 3.1c-12.4 8-22 8.2-30.5 3.6z" fill="url(#silk)"/>
  <path d="M17.5 23.5c7 3.6 15.6 4.3 28.4-2.8" fill="none" stroke="url(#gold)" stroke-width=".9"/>
  <path d="M46.3 17.2 44.4 21.6" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="49.2" cy="10.4" rx=".6" ry="1.5" transform="rotate(23 49.2 10.4)" fill="#0f0d0c"/>
  <path d="M49.2 10.4c3.6 1.6 4.6 6 2.4 9.6-1.6 2.6-4.4 3.1-6.6 2.2" fill="none" stroke="#e9dcc3" stroke-width=".8" stroke-linecap="round" stroke-dasharray="2.2 1.2"/>
  <!-- rarity star -->
  <path d="M32 6.2l1.1 2.9 2.9 1.1-2.9 1.1L32 14.2l-1.1-2.9-2.9-1.1 2.9-1.1z" fill="url(#gold)"/>
</svg>
