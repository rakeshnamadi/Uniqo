    <circle cx="160.4" cy="28" r="6"/><circle cx="172" cy="39.6" r="6"/><circle cx="181.4" cy="53" r="6"/><circle cx="188.3" cy="67.9" r="6"/>
    <circle cx="192.6" cy="83.7" r="6"/><circle cx="194" cy="100" r="6"/><circle cx="192.6" cy="116.3" r="6"/><circle cx="188.3" cy="132.1" r="6"/>
    <circle cx="181.4" cy="147" r="6"/><circle cx="172" cy="160.4" r="6"/><circle cx="160.4" cy="172" r="6"/><circle cx="147" cy="181.4" r="6"/>
    <circle cx="132.1" cy="188.3" r="6"/><circle cx="116.3" cy="192.6" r="6"/><circle cx="100" cy="194" r="6"/><circle cx="83.7" cy="192.6" r="6"/>
    <circle cx="67.9" cy="188.3" r="6"/><circle cx="53" cy="181.4" r="6"/><circle cx="39.6" cy="172" r="6"/><circle cx="28" cy="160.4" r="6"/>
    <circle cx="18.6" cy="147" r="6"/><circle cx="11.7" cy="132.1" r="6"/><circle cx="7.4" cy="116.3" r="6"/><circle cx="6" cy="100" r="6"/>
    <circle cx="7.4" cy="83.7" r="6"/><circle cx="11.7" cy="67.9" r="6"/><circle cx="18.6" cy="53" r="6"/><circle cx="28" cy="39.6" r="6"/>
    <circle cx="39.6" cy="28" r="6"/><circle cx="53" cy="18.6" r="6"/><circle cx="67.9" cy="11.7" r="6"/><circle cx="83.7" cy="7.4" r="6"/>
  </g>
  <circle cx="100" cy="100" r="86" fill="#14100d"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="url(#g)" stroke-width="1"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#g)" stroke-width="1"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#g)" stroke-width=".6" stroke-dasharray="1 3" stroke-linecap="round"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12.5" letter-spacing="3.2" fill="url(#g)">
    <textPath href="#ring" xlink:href="#ring" startOffset="0">UNIQO ✦ NUMBERED EDITION ✦ YOUR STYLE · YOUR RARITY ✦</textPath>
  </text>
  <!-- emblem inlined (an SVG used as <img> can't load other files) -->
  <svg x="56" y="56" width="88" height="88" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="mg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8f6224"/><stop offset=".35" stop-color="#e9c983"/><stop offset=".55" stop-color="#b8873b"/><stop offset=".8" stop-color="#f4dfae"/><stop offset="1" stop-color="#8f6224"/></linearGradient>
