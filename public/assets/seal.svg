      <stop offset=".55" stop-color="#b8873b"/><stop offset=".8" stop-color="#f4dfae"/><stop offset="1" stop-color="#8f6224"/>
    </linearGradient>
    <path id="ring" d="M100 100m-74 0a74 74 0 1 1 148 0a74 74 0 1 1-148 0"/>
  </defs>
  <!-- scalloped rosette edge: 36 petals -->
  <g fill="url(#g)">
    <circle cx="100" cy="100" r="92"/>
